<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日大宗商品与外汇监控 Dashboard - 初始化中</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 40px; text-align: center; }
        .box { background: #ffffff; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { font-size: 20px; color: #1d4ed8; }
        p { color: #64748b; line-height: 1.6; }
        .loader { margin: 20px auto; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="loader"></div>
        <h1>监控看板已就绪</h1>
        <p>GitHub Pages 已成功联通！正在等待第一个工作日早晨定时触发或手动触发 Actions 抓取最新数据。<br>一旦执行完成，此处将被完整的实时数据看板自动覆盖。</p>
    </div>
</body>
</html>
